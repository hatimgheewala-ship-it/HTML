<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Sports Registration Form</title>
</head>

<body>

    <h1>🏆 School Sports Registration</h1>
    <p>Fill in the form below to register for a school sports activity!</p>
    <hr>

    <form>

        <fieldset>
            <legend>Student Details</legend>

            <label>Your Name</label><br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>

            <label>Student ID</label><br>
            <input type="password" id="student-id" placeholder="Enter your student ID"><br><br>

            <label>Date of Birth</label><br>
            <input type="date" id="dob"><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Sports Details</legend>

            <label>Choose Your Sport</label><br>
            <select id="sport">
                <option value="">-- Select a sport --</option>
                <option value="football">Football</option>
                <option value="cricket">Cricket</option>
                <option value="basketball">Basketball</option>
                <option value="badminton">Badminton</option>
            </select><br><br>

            <label>Your Skill Level</label><br>
            <input type="radio" name="level" value="beginner"> Beginner<br>
            <input type="radio" name="level" value="intermediate"> Intermediate<br>
            <input type="radio" name="level" value="advanced"> Advanced<br><br>

            <label>Any Sports Experience?</label><br>
            <textarea id="notes" rows="3" cols="35" placeholder="Enter your previous sports experience."></textarea><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Preferred Practice Day</legend>

            <input type="checkbox" value="mon"> Monday<br>
            <input type="checkbox" value="wed"> Wednesday<br>
            <input type="checkbox" value="fri"> Friday<br>

        </fieldset>

        <br>
        <input type="submit" value="Register for Sports">

    </form>

</body>

</html>
