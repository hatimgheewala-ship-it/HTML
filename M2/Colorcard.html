<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Card</title>

    <style>
        /* Universal Selector - applies to everything on the page */
        * {
            font-size: 16px;
        }

        /* Element Selectors */
        body {
            background-color: lightyellow;
        }

        h1 {
            color: darkgreen;
        }

        h2 {
            color: darkorange;
        }

        p {
            color: dimgray;
        }

        /* Class Selector */
        .my-detail {
            color: darkblue;
            font-weight: bold;
        }

        /* ID Selector */
        #my-card {
            background-color: lightgreen;
        }
    </style>

</head>

<body>

    <h1>My Hobby Card</h1>

    <!-- Inline CSS: Add style="color: ____;" inside this p tag -->
    <p style="color: crimson;">Welcome to my hobby webpage!</p>

    <div id="my-card">

        <h2>About My Hobby</h2>
        <p class="my-detail">My name is Alex.</p>
        <p class="my-detail">My favourite hobby is drawing.</p>
        <p class="my-detail">I enjoy drawing cartoons.</p>
        <p class="my-detail">I usually draw in my free time.</p>

    </div>

    <h2>My Favourite Things</h2>
    <p>My favourite animal is a dog.</p>
    <p>My favourite sport is football.</p>
    <p>My favourite movie is Toy Story.</p>

</body>

</html>
