<!DOCTYPE html>
<html>

<head>
    <title>My Space Explorer Card</title>
    <style>
        /* Typography — font, size, weight, colour for the whole page */
        body {
            background-color: midnightblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Typography + Text Shadow — big bold title with a purple shadow */
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: lightcyan;
            text-shadow: 3px 3px purple;
        }

        /* Typography + Text Transform — tagline becomes Title Case */
        .tagline {
            font-style: italic;
            color: lightyellow;
            text-transform: capitalize;
        }

        /* Text Transform + Text Decoration — section headings in CAPS with underline */
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: orange;
        }

        /* Typography — skills stand out in bold green */
        .power {
            font-weight: bold;
            color: lightgreen;
        }

        /* Text Decoration — challenges are crossed out */
        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        /* Transform — the badge is tilted to the side */
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        /* Typography — footer text */
        .made-by {
            color: lightpink;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1 class="hero-name">Space Explorer</h1>
    <p class="tagline">the greatest explorer of the galaxy</p>

    <h2 class="label">special skills</h2>
    <p class="power">Can travel through outer space</p>
    <p class="power">Can identify distant planets</p>

    <h2 class="label">space challenges</h2>
    <p class="weakness">Getting lost in space</p>
    <p class="weakness">Running out of oxygen</p>

    <p class="badge">Galaxy Star</p>

    <p class="made-by">Created by ___________</p>

</body>

</html>
